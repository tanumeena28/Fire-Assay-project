<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Dispatch Entry</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F172A; /* slate-900 */
      color: #F8FAFC; /* slate-50 */
      margin: 0;
      padding: 16px 20px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .container {
      max-width: 100%;
    }

    /* Header styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .header-title h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #F1F5F9;
    }

    .header-title p {
      margin: 4px 0 0 0;
      font-size: 11px;
      color: #94A3B8;
    }

    .card {
      background-color: #1E293B; /* slate-800 */
      border: 1px solid #334155; /* slate-700 */
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #3B82F6;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      color: #CBD5E1;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #475569;
      border-radius: 6px;
      background-color: #0F172A;
      color: #FFFFFF;
      font-size: 12px;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    select:focus, input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
      outline: none;
      border-color: #3B82F6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* Auto-fill read-only elements */
    .readonly-box {
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #94A3B8;
      min-height: 18px;
    }

    /* Checklist grid */
    .checklist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .checkbox-container:hover {
      border-color: #475569;
      background-color: #1E293B;
    }

    .checkbox-container input[type="checkbox"] {
      margin-right: 10px;
      cursor: pointer;
      accent-color: #3B82F6;
      width: 15px;
      height: 15px;
    }

    .checkbox-container span {
      font-size: 11px;
      color: #CBD5E1;
    }

    /* Buttons */
    .btn-action {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-action:disabled {
      background: #475569 !important;
      color: #94A3B8 !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-small {
      background-color: #334155;
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-small:hover {
      background-color: #475569;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      border-top: 1px solid #334155;
      padding-top: 14px;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFF;
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-weight: 500;
      text-align: center;
      font-size: 12px;
    }

    .success-msg {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #34D399;
    }

    .error-msg {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #F87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <h2>Dispatch Desk</h2>
        <p>NCH Services Pvt. Ltd., Surat | Dispatch & Verifications</p>
      </div>
      <button class="btn-small" onclick="google.script.host.close()">Close</button>
    </div>

    <!-- Alert Message Box -->
    <div id="messageBox" class="message hidden"></div>

    <form id="dispatchForm" onsubmit="event.preventDefault(); submitDispatch();">
      
      <!-- Selection Card -->
      <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="receiptSelect">Select Receipt Number</label>
          <select id="receiptSelect" onchange="handleReceiptChange()" required>
            <option value="">-- Loading Completed Receipts... --</option>
          </select>
        </div>
      </div>

      <!-- Details Card (Visible only when receipt selected) -->
      <div class="card hidden" id="detailsCard">
        <h3>Receipt Details</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Customer Name</label>
            <div id="txtCustomerName" class="readonly-box">-</div>
          </div>
          <div class="form-group">
            <label>Number of Reports</label>
            <div id="txtReportCount" class="readonly-box">-</div>
          </div>
        </div>
      </div>

      <!-- Dispatch Log Card -->
      <div class="card hidden" id="logCard">
        <h3>Log Dispatch Details</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="dispatchDate">Dispatch Date</label>
            <input type="date" id="dispatchDate" required>
          </div>
          <div class="form-group">
            <label for="dispatchedBy">Dispatched By</label>
            <input type="text" id="dispatchedBy" placeholder="Assayer / staff name" required>
          </div>
          <div class="form-group full-width">
            <label for="courierName">Courier Name / Hand Delivery</label>
            <input type="text" id="courierName" placeholder="Courier company or 'By Hand'" required>
          </div>
          
          <!-- Checklist Section -->
          <div class="form-group full-width">
            <label>Verification Checklist</label>
            <div class="checklist-grid">
              <label class="checkbox-container">
                <input type="checkbox" id="chkFireReport">
                <span>Fire Assay Report Sent</span>
              </label>
              <label class="checkbox-container">
                <input type="checkbox" id="chkInvoice">
                <span>Invoice Generated</span>
              </label>
              <label class="checkbox-container">
                <input type="checkbox" id="chkSticker">
                <span>Sticker Done</span>
              </label>
              <label class="checkbox-container">
                <input type="checkbox" id="chkQR">
                <span>QR Code Done</span>
              </label>
              <label class="checkbox-container" style="grid-column: span 2;">
                <input type="checkbox" id="chkVerification">
                <span>Verification Checklist Confirmed (Yes)</span>
              </label>
            </div>
          </div>

          <div class="form-group full-width">
            <label for="remarks">Remarks / Delivery Notes</label>
            <textarea id="remarks" rows="2" placeholder="Docket numbers, witness signatures, or other notes"></textarea>
          </div>
        </div>

        <div class="footer-actions">
          <button type="submit" class="btn-action" id="btnSubmit">
            <span id="submitSpinner" class="spinner hidden" style="margin-right: 6px;"></span>Save Dispatch Record
          </button>
        </div>
      </div>

    </form>
  </div>

  <script>
    // Startup
    window.addEventListener('DOMContentLoaded', function() {
      // Set default date input value to today in user's timezone
      var today = new Date().toISOString().split('T')[0];
      document.getElementById('dispatchDate').value = today;
      loadReceiptDropdown();
    });

    /**
     * Loads the dropdown with receipt numbers that are ready for dispatch
     */
    function loadReceiptDropdown() {
      var select = document.getElementById('receiptSelect');
      select.innerHTML = '<option value="">-- Loading Completed Receipts... --</option>';

      google.script.run
        .withSuccessHandler(function(receipts) {
          select.innerHTML = '';
          
          if (receipts.length === 0) {
            var opt = document.createElement('option');
            opt.value = "";
            opt.textContent = "-- No completed assays/reports found --";
            select.appendChild(opt);
            return;
          }

          var optDefault = document.createElement('option');
          optDefault.value = "";
          optDefault.textContent = "-- Select Receipt No --";
          select.appendChild(optDefault);

          for (var i = 0; i < receipts.length; i++) {
            var opt = document.createElement('option');
            opt.value = receipts[i];
            opt.textContent = receipts[i];
            select.appendChild(opt);
          }
        })
        .withFailureHandler(function(err) {
          showMsg("Failed to load receipt options: " + err.message, "error");
        })
        .getCompletedReceiptsForDispatch();
    }

    /**
     * Handles selection change and fetches details from backend
     */
    function handleReceiptChange() {
      var receiptNo = document.getElementById('receiptSelect').value;
      var detailsCard = document.getElementById('detailsCard');
      var logCard = document.getElementById('logCard');
      var msgBox = document.getElementById('messageBox');
      
      msgBox.className = "message hidden";

      if (!receiptNo) {
        detailsCard.classList.add('hidden');
        logCard.classList.add('hidden');
        return;
      }

      google.script.run
        .withSuccessHandler(function(details) {
          document.getElementById('txtCustomerName').textContent = details.customerName || "N/A";
          document.getElementById('txtReportCount').textContent = details.reportCount + " Sample(s)";
          
          // Pre-populate fields if an existing log is found
          if (details.existingLog) {
            document.getElementById('dispatchDate').value = details.existingLog.dispatchDate || new Date().toISOString().split('T')[0];
            document.getElementById('dispatchedBy').value = details.existingLog.dispatchedBy || "";
            document.getElementById('courierName').value = details.existingLog.courierName || "";
            document.getElementById('chkFireReport').checked = details.existingLog.fireReportSent;
            document.getElementById('chkInvoice').checked = details.existingLog.invoiceGenerated;
            document.getElementById('chkSticker').checked = details.existingLog.stickerDone;
            document.getElementById('chkQR').checked = details.existingLog.qrCodeDone;
            document.getElementById('chkVerification').checked = details.existingLog.reportVerification;
            document.getElementById('remarks').value = details.existingLog.remarks || "";
            
            showMsg("Existing dispatch record loaded. Submitting will update the record.", "success");
          } else {
            // Reset to defaults
            document.getElementById('dispatchDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('dispatchedBy').value = "";
            document.getElementById('courierName').value = "";
            document.getElementById('chkFireReport').checked = false;
            document.getElementById('chkInvoice').checked = false;
            document.getElementById('chkSticker').checked = false;
            document.getElementById('chkQR').checked = false;
            document.getElementById('chkVerification').checked = false;
            document.getElementById('remarks').value = "";
          }

          detailsCard.classList.remove('hidden');
          logCard.classList.remove('hidden');
        })
        .withFailureHandler(function(err) {
          showMsg("Failed to load details: " + err.message, "error");
        })
        .getReceiptDetailsForDispatch(receiptNo);
    }

    /**
     * Submits the form data to backend
     */
    function submitDispatch() {
      var btn = document.getElementById('btnSubmit');
      var spinner = document.getElementById('submitSpinner');
      
      btn.disabled = true;
      spinner.classList.remove('hidden');

      var payload = {
        receiptNo: document.getElementById('receiptSelect').value,
        customerName: document.getElementById('txtCustomerName').textContent,
        reportCount: document.getElementById('txtReportCount').textContent.split(' ')[0],
        dispatchDate: document.getElementById('dispatchDate').value,
        dispatchedBy: document.getElementById('dispatchedBy').value,
        courierName: document.getElementById('courierName').value,
        fireReportSent: document.getElementById('chkFireReport').checked,
        invoiceGenerated: document.getElementById('chkInvoice').checked,
        stickerDone: document.getElementById('chkSticker').checked,
        qrCodeDone: document.getElementById('chkQR').checked,
        reportVerification: document.getElementById('chkVerification').checked,
        remarks: document.getElementById('remarks').value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showMsg(res, "success");
          
          // Reload the list to refresh status
          loadReceiptDropdown();
          
          // Hide logs sections and reset select
          document.getElementById('receiptSelect').value = "";
          document.getElementById('detailsCard').classList.add('hidden');
          document.getElementById('logCard').classList.add('hidden');
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showMsg("Submission failed: " + err.message, "error");
        })
        .saveDispatchEntry(payload);
    }

    function showMsg(text, type) {
      var msgBox = document.getElementById('messageBox');
      msgBox.innerHTML = text;
      msgBox.className = "message " + (type === "success" ? "success-msg" : "error-msg");
      msgBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
