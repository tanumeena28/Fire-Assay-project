<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Invoice Management</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F172A; /* slate-900 */
      color: #F8FAFC; /* slate-50 */
      margin: 0;
      padding: 16px 20px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .container {
      max-width: 100%;
    }

    /* Header styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .header-title h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #F1F5F9;
    }

    .header-title p {
      margin: 4px 0 0 0;
      font-size: 11px;
      color: #94A3B8;
    }

    .card {
      background-color: #1E293B; /* slate-800 */
      border: 1px solid #334155; /* slate-700 */
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #3B82F6;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      color: #CBD5E1;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #475569;
      border-radius: 6px;
      background-color: #0F172A;
      color: #FFFFFF;
      font-size: 12px;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    select:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
      outline: none;
      border-color: #3B82F6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .readonly-box {
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #94A3B8;
      min-height: 18px;
    }

    /* Live Preview Calculation Box */
    .preview-box {
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #94A3B8;
    }

    .preview-row.total {
      border-top: 1px solid #334155;
      padding-top: 8px;
      font-weight: bold;
      color: #10B981; /* emerald-500 */
      font-size: 14px;
    }

    /* Status badges */
    .status-badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pending {
      background-color: rgba(148, 163, 184, 0.15);
      border: 1px solid #94A3B8;
      color: #CBD5E1;
    }

    .badge-invoiced {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #34D399;
    }

    /* Buttons */
    .btn-action {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-action:disabled, .btn-print:disabled {
      background: #475569 !important;
      color: #94A3B8 !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-print {
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
    }

    .btn-print:hover {
      background: linear-gradient(135deg, #34D399, #10B981);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-small {
      background-color: #334155;
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-small:hover {
      background-color: #475569;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      border-top: 1px solid #334155;
      padding-top: 14px;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFF;
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-weight: 500;
      text-align: center;
      font-size: 12px;
    }

    .success-msg {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #34D399;
    }

    .error-msg {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #F87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <h2>Invoice Desk</h2>
        <p>NCH Services Pvt. Ltd., Surat | Billing & Tax Invoices</p>
      </div>
      <button class="btn-small" onclick="google.script.host.close()">Close</button>
    </div>

    <!-- Alert Box -->
    <div id="messageBox" class="message hidden"></div>

    <!-- Dropdown Selector Card -->
    <div class="card">
      <div class="form-group" style="margin-bottom: 0;">
        <label for="receiptSelect">Select Receipt for Invoice</label>
        <select id="receiptSelect" onchange="handleSelectionChange()">
          <option value="">-- Loading Receipts... --</option>
        </select>
      </div>
    </div>

    <!-- Invoice Details Card -->
    <div class="card hidden" id="detailsCard">
      <h3>Invoice Configuration</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Customer Name</label>
          <div id="txtCustomer" class="readonly-box">-</div>
        </div>
        <div class="form-group">
          <label>Number of Samples</label>
          <div id="txtSamples" class="readonly-box">-</div>
        </div>
        <div class="form-group">
          <label for="rateInput">Rate per Sample (₹)</label>
          <input type="number" id="rateInput" value="200" min="0" step="5" oninput="calculateLivePreview()" required>
        </div>
        <div class="form-group">
          <label>Status</label>
          <div style="margin-top: 6px;">
            <span id="invoiceStatusBadge" class="status-badge badge-pending">Pending</span>
            <span id="txtInvoiceNo" style="margin-left: 8px; font-weight: 500; font-size: 11px; color: #94A3B8;"></span>
          </div>
        </div>
        <div class="form-group full-width">
          <label for="notesInput">Billing Notes / Memo</label>
          <textarea id="notesInput" rows="2" placeholder="Payment terms, bank details, or additional references"></textarea>
        </div>

        <!-- Live Preview Panel -->
        <div class="form-group full-width">
          <label>Live Calculation Preview</label>
          <div class="preview-box">
            <div class="preview-row">
              <span>Qty (Samples)</span>
              <span id="prevQty">0</span>
            </div>
            <div class="preview-row">
              <span>Rate per Sample</span>
              <span id="prevRate">₹0.00</span>
            </div>
            <div class="preview-row">
              <span>Subtotal</span>
              <span id="prevSubtotal">₹0.00</span>
            </div>
            <div class="preview-row">
              <span>GST (18%)</span>
              <span id="prevGST">₹0.00</span>
            </div>
            <div class="preview-row total">
              <span>TOTAL AMOUNT</span>
              <span id="prevTotal">₹0.00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Panel -->
      <div class="footer-actions">
        <button type="button" class="btn-action" id="btnGenerate" onclick="processInvoice()">
          <span id="genSpinner" class="spinner hidden" style="margin-right: 6px;"></span><span id="btnGenText">Generate Invoice</span>
        </button>
        <button type="button" class="btn-action btn-print" id="btnPrint" disabled onclick="printInvoiceSlip()">
          <span id="printSpinner" class="spinner hidden" style="margin-right: 6px;"></span>Print Invoice Slip
        </button>
      </div>

    </div>

  </div>

  <script>
    var receiptList = [];
    var activeReceipt = null;

    // Startup
    window.addEventListener('DOMContentLoaded', function() {
      loadReceiptList();
    });

    /**
     * Loads the dropdown options from backend
     */
    function loadReceiptList() {
      var select = document.getElementById('receiptSelect');
      select.innerHTML = '<option value="">-- Loading Receipts... --</option>';

      google.script.run
        .withSuccessHandler(function(list) {
          receiptList = list;
          select.innerHTML = '';

          if (list.length === 0) {
            var opt = document.createElement('option');
            opt.value = "";
            opt.textContent = "-- No receipts found in system --";
            select.appendChild(opt);
            document.getElementById('detailsCard').classList.add('hidden');
            return;
          }

          var optDefault = document.createElement('option');
          optDefault.value = "";
          optDefault.textContent = "-- Select Receipt No --";
          select.appendChild(optDefault);

          for (var i = 0; i < list.length; i++) {
            var opt = document.createElement('option');
            opt.value = list[i].receiptNo;
            var label = list[i].receiptNo + ' (' + list[i].customerName + ' | ' + list[i].status;
            if (list[i].invoiceNo) {
              label += ': ' + list[i].invoiceNo;
            }
            label += ')';
            opt.textContent = label;
            select.appendChild(opt);
          }
        })
        .withFailureHandler(function(err) {
          showMsg("Failed to load receipts: " + err.message, "error");
        })
        .getInvoiceReceiptList();
    }

    /**
     * Handles select changes
     */
    function handleSelectionChange() {
      var val = document.getElementById('receiptSelect').value;
      var card = document.getElementById('detailsCard');
      var msgBox = document.getElementById('messageBox');
      
      msgBox.className = "message hidden";

      if (!val) {
        card.classList.add('hidden');
        activeReceipt = null;
        return;
      }

      activeReceipt = receiptList.find(function(r) {
        return r.receiptNo === val;
      });

      if (activeReceipt) {
        document.getElementById('txtCustomer').textContent = activeReceipt.customerName;
        document.getElementById('txtSamples').textContent = activeReceipt.sampleCount + " sample(s)";
        document.getElementById('rateInput').value = activeReceipt.rate;
        
        var badge = document.getElementById('invoiceStatusBadge');
        var lblInvoice = document.getElementById('txtInvoiceNo');
        
        var btnGen = document.getElementById('btnGenerate');
        var btnPrint = document.getElementById('btnPrint');
        
        // Reset button states
        btnGen.disabled = false;
        btnPrint.disabled = false;

        if (activeReceipt.status === "Pending") {
          badge.textContent = "Pending";
          badge.className = "status-badge badge-pending";
          lblInvoice.textContent = "";
          document.getElementById('btnGenText').textContent = "Generate Invoice";
          btnPrint.disabled = true;
        } else {
          badge.textContent = "Invoiced";
          badge.className = "status-badge badge-invoiced";
          lblInvoice.textContent = "Invoice: " + activeReceipt.invoiceNo;
          document.getElementById('btnGenText').textContent = "Re-generate Invoice";
          btnPrint.disabled = false;
        }

        calculateLivePreview();
        card.classList.remove('hidden');
      }
    }

    /**
     * Updates the calculation box in real time
     */
    function calculateLivePreview() {
      if (!activeReceipt) return;

      var qty = activeReceipt.sampleCount;
      var rate = parseFloat(document.getElementById('rateInput').value) || 0;
      var subtotal = qty * rate;
      var gst = subtotal * 0.18;
      var total = subtotal + gst;

      document.getElementById('prevQty').textContent = qty;
      document.getElementById('prevRate').textContent = "₹" + rate.toFixed(2);
      document.getElementById('prevSubtotal').textContent = "₹" + subtotal.toFixed(2);
      document.getElementById('prevGST').textContent = "₹" + gst.toFixed(2);
      document.getElementById('prevTotal').textContent = "₹" + total.toFixed(2);
    }

    /**
     * Triggers invoice generation on backend
     */
    function processInvoice() {
      if (!activeReceipt) return;

      var receiptNo = activeReceipt.receiptNo;
      var rate = parseFloat(document.getElementById('rateInput').value) || 0;
      var notes = document.getElementById('notesInput').value;
      
      var btn = document.getElementById('btnGenerate');
      var spinner = document.getElementById('genSpinner');

      btn.disabled = true;
      spinner.classList.remove('hidden');

      google.script.run
        .withSuccessHandler(function(invoiceNo) {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showMsg("Successfully generated Invoice: " + invoiceNo, "success");
          
          // Reload list and preserve focus
          google.script.run
            .withSuccessHandler(function(list) {
              receiptList = list;
              
              // Refresh dropdown options text
              var select = document.getElementById('receiptSelect');
              var selIndex = select.selectedIndex;
              
              select.innerHTML = '';
              var optDefault = document.createElement('option');
              optDefault.value = "";
              optDefault.textContent = "-- Select Receipt No --";
              select.appendChild(optDefault);

              for (var i = 0; i < list.length; i++) {
                var opt = document.createElement('option');
                opt.value = list[i].receiptNo;
                var label = list[i].receiptNo + ' (' + list[i].customerName + ' | ' + list[i].status;
                if (list[i].invoiceNo) {
                  label += ': ' + list[i].invoiceNo;
                }
                label += ')';
                opt.textContent = label;
                select.appendChild(opt);
              }
              
              select.selectedIndex = selIndex;
              handleSelectionChange(); // Refresh details badge
            })
            .getInvoiceReceiptList();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showMsg("Generation failed: " + err.message, "error");
        })
        .generateInvoice(receiptNo, rate, notes);
    }

    /**
     * Compiles printable worksheet layout
     */
    function printInvoiceSlip() {
      if (!activeReceipt || !activeReceipt.invoiceNo) return;

      var invoiceNo = activeReceipt.invoiceNo;
      var btn = document.getElementById('btnPrint');
      var spinner = document.getElementById('printSpinner');

      btn.disabled = true;
      spinner.classList.remove('hidden');

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showMsg("Invoice print preview successfully compiled in tab 'Invoice_Print'!", "success");
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showMsg("Print layout failed: " + err.message, "error");
        })
        .printInvoice(invoiceNo);
    }

    function showMsg(text, type) {
      var msgBox = document.getElementById('messageBox');
      msgBox.innerHTML = text;
      msgBox.className = "message " + (type === "success" ? "success-msg" : "error-msg");
      msgBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
